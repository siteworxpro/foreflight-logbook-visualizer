name: "🚀✨ Deploy Static Website to GitHub Pages 🌐🎉"

on:
  workflow_dispatch: { }
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🧰 Setup Node.js v25"
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - name: "📦 Install dependencies & Build (js) 🔧"
        run: |
          echo "⬇️ Installing dependencies (production only)..."
          npm i --no-dev
          echo "🏗️ Building site..."
          npm run build
          echo "✅ Build complete"

      - name: "⚙️ Setup GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "📤 Upload artifact (dist) — ready for Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: "🚢 Deploy to GitHub Pages — go live! 🌟"
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "🎉 Publish result"
        run: |
          echo "🚀 Pages deployment finished."
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "🔗 Live at: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "ℹ️ Deployment URL not available as output."
          fi