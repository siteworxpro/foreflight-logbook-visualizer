on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

name: 🏗️✨ Build Workflow

env:
  NODE_TLS_REJECT_UNAUTHORIZED: 0

jobs:
  Test:
    name: 🧪 ✅ Test
    runs-on: ubuntu-latest
    steps:
      - name: 📖 🔍 Checkout Repository Code
        uses: actions/checkout@v6

      - name: 📦 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 ⬇️ Install Dependencies
        run: npm ci

      - name: 🧪 ▶️ Run Tests
        run: npm test

      - name: 🏗️ 🔨 Type-check and Build
        run: npm run build

  Build:
    name: 🖥️ 🔨 Build
    needs: Test
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📖 🔍 Checkout Repository Code
        uses: actions/checkout@v6

      - name: 🖥️ 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🏗️ 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 🔐 Login to dh
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔑 🔐 Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: scr.siteworxpro.com
          username: ${{ secrets.SITEWORX_USERNAME }}
          password: ${{ secrets.SITEWORX_PASSWORD }}

      - name: 🏷️ Docker Metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: scr.siteworxpro.com/foreflight-logbook-visualizer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: 🐳 🔨 Build Container
        uses: docker/build-push-action@v6
        with:
          sbom: true
          push: true
          provenance: true
          platforms: linux/amd64,linux/arm64
          context: .
          dockerfile: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
